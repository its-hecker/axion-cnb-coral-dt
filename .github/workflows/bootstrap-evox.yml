name: Bootstrap coral device tree from Evolution X

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-evox.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone verified hardware tree and port scripts
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/its-hecker/evox-coral-dt.git "$RUNNER_TEMP/source"
          git clone --depth 1 --branch main https://github.com/its-hecker/axion-cnb-coral-localmanifest.git "$RUNNER_TEMP/port"
      - name: Apply Axion-specific product flags, preserving hardware support
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 "$RUNNER_TEMP/port/scripts/adapt-device.py"
          git config user.name "Hecker"
          git config user.email "118846180+its-hecker@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Adapt coral Evolution X device tree for AxionOS"
          fi
      - name: Publish isolated Android 17 staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          git push "https://x-access-token:${GH_TOKEN}@github.com/its-hecker/axion-cnb-coral-dt.git" HEAD:refs/heads/cnb-android17-prep
